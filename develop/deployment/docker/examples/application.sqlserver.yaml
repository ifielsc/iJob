spring.datasource.url: jdbc:sqlserver://db.example.invalid:1433;databaseName=ijob;encrypt=true;trustServerCertificate=false
spring.datasource.driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username: REPLACE_WITH_DATABASE_USER
spring.datasource.password: REPLACE_WITH_DATABASE_PASSWORD
spring.flyway.enabled: true
app.auth.mode: STATIC
app.auth.username: REPLACE_WITH_ADMIN_NAME
app.auth.password-hash: REPLACE_WITH_BCRYPT_HASH
app.security.aes.key: REPLACE_WITH_BASE64_32_BYTE_KEY
app.security.aes.key-id: release-key-1
app.runtime.groups: default
app.schedule.enabled: true
app.notification.outbox.enabled: true
app.event.recovery.enabled: true
app.runtime.maintenance.enabled: true
app.retention.enabled: false
app.platform-database.schema: dbo
spring.flyway.default-schema: dbo
spring.datasource.hikari.schema: dbo
