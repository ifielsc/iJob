services:
  agent:
    image: ijob-monitor-agent:${IJOB_IMAGE_TAG:-1.0.0}
    build:
      context: ../../api
      dockerfile: ijob-monitor-agent/Dockerfile
      args:
        MAVEN_IMAGE: ${IJOB_MAVEN_IMAGE:?Load images.env}
        JRE_IMAGE: ${IJOB_JRE_IMAGE:?Load images.env}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=0700,uid=10001,gid=10001,exec
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 1.0
    secrets:
      - source: agent_token
        target: agent.token
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
secrets:
  agent_token:
    file: ${IJOB_AGENT_TOKEN_PATH:?Set an absolute private token file path}
